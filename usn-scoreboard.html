<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USN Basketball Scoreboard</title>
<!--
  USN BASKETBALL SCOREBOARD — one file, no installs.

  HOW IT OPENS
    usn-scoreboard.html                 scoreboard + control panel side by side (try it out, or use on a TV)
    usn-scoreboard.html?view=overlay    graphics only, transparent background (OBS browser source). ?output does the same.
    usn-scoreboard.html?view=control    control panel only, with a small preview (OBS custom dock, or a phone)
  Inside an OBS browser source the page switches to overlay mode by itself.

  HOW THE WINDOWS TALK
    The control panel owns the game. Every change is saved to localStorage and sent to the
    other windows over a BroadcastChannel. Both windows must be on the SAME computer and in
    the SAME program (both in OBS, or both in the same Chrome/Edge profile).
    To run it from a phone or another laptop, turn on remote control in the Remote tab
    (search "REMOTE CONTROL" below for how it works).

  WHERE TO TWEAK THE CODE
    1. CSS: scoreboard look ............ search "SCOREBOARD STYLES"
    2. CSS: animations ................. search "ANIMATIONS"
    3. JS : default teams, rules, look .. search "DEFAULTS"
    4. JS : keyboard shortcuts .......... search "KEYBOARD SHORTCUTS"
    6. Name graphic (lower third) ....... search "LOWER THIRD" (styles) and "lower third (name graphic)" (script)
    7. Lineups, schedule, standings ..... search "FULL-SCREEN GRAPHICS" (styles) and "BROADCAST GRAPHICS PACKAGE" (script)
    8. Stats tab + half-time report ...... search "half-time report" (styles) and "STATS AND HALF-TIME REPORT" (script)
    9. Countdown screen (off air) ........ search "COUNTDOWN SCREEN" (styles and script)
    5. JS : sounds ...................... search "SOUND"
-->
<style>
/* ============================================================
   PAGE + STAGE
   The stage is a fixed 1920x1080 canvas that is scaled to fit
   whatever window it is in, so the layout never changes.
   ============================================================ */
:root{
  --d:1;                 /* animation duration multiplier (1 / speed) */
  --font:'Barlow Condensed';
  --clock-bg:#101216; --clock-tx:#ffffff;
  --meta-bg:#e9eaec;  --meta-tx:#15171b;
  --accent:#ffc629;   --low:#ff3b30;
  --radius:10px;
}
html,body{margin:0;height:100%}
body{background:transparent;overflow:hidden;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
[hidden]{display:none!important}
#viewport{position:relative;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.checker{background:#3a3f4a repeating-conic-gradient(#343944 0% 25%,#3f4551 0% 50%) 0 0/28px 28px}

/* overlay: scoreboard only */
.mode-overlay #viewport{position:fixed;left:0;top:0;right:0;bottom:0}
.mode-overlay #panel,.mode-overlay #panelToggle{display:none}
/* combined: scoreboard on the left, panel on the right */
.mode-combined{display:flex}
.mode-combined #viewport{flex:1;height:100vh;min-width:0}
.mode-combined #panel{width:480px;flex:none;height:100vh;overflow-y:auto}
.mode-combined.panel-hidden #panel{display:none}
/* control: small preview on top, panel underneath */
.mode-control{overflow:auto}
.mode-control #viewport{position:sticky;top:0;z-index:5;width:100%;border-bottom:1px solid #2a2f39}
.mode-control #stage{width:800px;height:410px}
.mode-control #panelToggle{display:none}
.mode-control .tabs{position:static}

/* ============================================================
   SCOREBOARD STYLES
   Sizes are in px for a 730 x 208 scorebug; the whole thing is
   scaled with the "Size" slider, so change proportions here.
   ============================================================ */
#bugwrap{position:absolute;width:730px}
#bug{position:relative;z-index:1;display:flex;height:208px;border-radius:var(--radius);overflow:hidden;
  font-family:var(--font),'Arial Narrow','Roboto Condensed',Impact,sans-serif;font-weight:700;
  box-shadow:0 10px 30px rgba(0,0,0,.45);
  transition:opacity calc(.35s*var(--d)),transform calc(.35s*var(--d))}
#bug.off{opacity:0;transform:translateY(22px)}

/* left column: game clock on top, period + shot clock below */
.timecol{width:210px;flex:none;display:flex;flex-direction:column}
.clock{height:122px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;
  background:var(--clock-bg);color:var(--clock-tx);font-size:78px;line-height:1}
.gloss .clock{background-image:linear-gradient(rgba(255,255,255,.10),rgba(255,255,255,0) 60%)}
.clock .dg{display:inline-block;width:.52em;text-align:center}
.clock .pt{display:inline-block;width:.24em;text-align:center}
.clock.low{color:var(--low)}
.meta{flex:1;display:flex;align-items:center;justify-content:space-around;padding:0 10px;
  background:var(--meta-bg);color:var(--meta-tx)}
#period{font-size:46px;line-height:1;display:inline-block;white-space:nowrap}
.shot{width:62px;height:62px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--meta-tx);color:var(--meta-bg);font-size:38px;line-height:1}
.shot.low{background:var(--low);color:#fff}
.noshot .shot,.final .shot{display:none}

/* team rows */
.rows{flex:1;min-width:0;display:flex;flex-direction:column}
.row{flex:1;min-height:0;display:flex;position:relative;color:var(--tx)}
.row + .row{border-top:2px solid rgba(0,0,0,.4)}
.bonus{width:40px;flex:none;display:flex;align-items:center;justify-content:center;background:#272c36;
  transition:background calc(.3s*var(--d))}
.bonus span{transform:rotate(-90deg);font-size:19px;letter-spacing:.14em;white-space:nowrap;color:rgba(255,255,255,.2);
  transition:color calc(.3s*var(--d))}
.row.inbonus .bonus{background:var(--accent)}
.row.inbonus .bonus span{color:#111}
.teamcell{flex:1;min-width:0;position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;
  padding:0 34px 0 14px;background:linear-gradient(90deg,var(--c1),var(--c1d))}
.gloss .teamcell::before,.gloss .scorecell::before{content:'';position:absolute;left:0;right:0;top:0;height:55%;
  background:linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,0));pointer-events:none}
.logo{width:76px;height:76px;flex:none;position:relative;border-radius:50%;display:flex;align-items:center;justify-content:center}
.logo.badge{overflow:hidden;background:rgba(0,0,0,.28);box-shadow:0 0 0 3px var(--c2),inset 0 0 0 2px rgba(255,255,255,.14)}
.logo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.logo.badge img{max-width:80%;max-height:80%}
.mono{font-size:42px;line-height:1;color:#fff}
.names{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.abbr{align-self:flex-start;display:inline-block;transform-origin:0 50%;font-size:58px;line-height:.95;white-space:nowrap;
  text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.22)}
.sub{display:flex;align-items:center;gap:9px;height:20px;margin-top:3px;font-size:16px;font-weight:600;white-space:nowrap;opacity:.92}
.tos{display:inline-flex;gap:3px}
.tos i{width:11px;height:6px;border-radius:2px;background:currentColor}
.tos i.used{opacity:.25}
.nostats .tos,.nostats .fls{display:none}
.poss{position:absolute;right:10px;top:50%;margin-top:-9px;width:0;height:0;border:9px solid transparent;border-left:0;
  border-right:13px solid currentColor;opacity:0;transform:translateX(12px);
  transition:opacity calc(.25s*var(--d)),transform calc(.25s*var(--d))}
.row.haspos .poss{opacity:1;transform:none}
.scorecell{width:150px;flex:none;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:var(--c2);color:var(--tx2);font-size:92px;line-height:1}
.score{display:block}

/* banner strip that slides out from behind the scorebug */
#strip{position:absolute;left:0;right:0;height:calc(54px + var(--radius));overflow:hidden;pointer-events:none}
#strip.above{bottom:calc(100% - var(--radius))}
#strip.below{top:calc(100% - var(--radius))}
#stripInner{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;justify-content:center;gap:16px;
  font-family:var(--font),'Arial Narrow',Impact,sans-serif;font-weight:700;font-size:32px;letter-spacing:.06em;
  text-transform:uppercase;white-space:nowrap;background:var(--sb,#101216);color:var(--st,#fff);
  transition:transform calc(.45s*var(--d)) cubic-bezier(.2,.8,.2,1)}
#stripInner span{line-height:54px}
#stripInner .dim{opacity:.7}
.above #stripInner{align-items:flex-start;transform:translateY(101%);border-radius:var(--radius) var(--radius) 0 0}
.below #stripInner{align-items:flex-end;transform:translateY(-101%);border-radius:0 0 var(--radius) var(--radius)}
#strip.on #stripInner{transform:none}

/* ============================================================
   ANIMATIONS
   Every duration is multiplied by var(--d) so the Speed slider
   in the control panel changes them all together.
   ============================================================ */
/* score: old number rolls up and out, new one rolls in, cell flashes */
@keyframes rollIn{from{transform:translateY(90%);opacity:0}to{transform:none;opacity:1}}
@keyframes rollOut{to{transform:translateY(-90%);opacity:0}}
@keyframes flash{from{opacity:.85}to{opacity:0}}
@keyframes lift{from{filter:brightness(1.5)}to{filter:brightness(1)}}
.score.in{animation:rollIn calc(.42s*var(--d)) cubic-bezier(.2,.9,.3,1.25)}
.ghost{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;
  animation:rollOut calc(.3s*var(--d)) ease-in forwards}
.scorecell::after{content:'';position:absolute;left:0;top:0;right:0;bottom:0;background:#fff;opacity:0;pointer-events:none}
.scorecell.flash::after{animation:flash calc(.7s*var(--d)) ease-out}
.scorecell.flash3::after{animation:flash calc(.5s*var(--d)) ease-out 3}
.teamcell.lift{animation:lift calc(.8s*var(--d)) ease-out}

/* 3-pointer: a banner wipes across the team's row */
@keyframes sweep{0%{clip-path:inset(0 100% 0 0)}16%{clip-path:inset(0 0 0 0)}80%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 100%)}}
@keyframes sweepText{0%{transform:translateX(-40px) skewX(-8deg)}16%{transform:translateX(0) skewX(-8deg)}100%{transform:translateX(14px) skewX(-8deg)}}
.sweep{position:absolute;left:0;top:0;right:0;bottom:0;z-index:3;display:flex;align-items:center;justify-content:center;
  background:var(--tx);color:var(--c1);font-size:52px;letter-spacing:.02em;white-space:nowrap;
  clip-path:inset(0 100% 0 0);pointer-events:none}
.sweep span{display:inline-block;transform:skewX(-8deg)}
.sweep.go{animation:sweep calc(2.1s*var(--d)) cubic-bezier(.7,0,.2,1) both}
.sweep.go span{animation:sweepText calc(2.1s*var(--d)) ease-out both}

/* logo: pulse + a shine that crosses the badge */
@keyframes logoPulse{0%{transform:scale(1)}30%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes shine{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
.logo.pulse{animation:logoPulse calc(.6s*var(--d)) ease-out}
.logo.badge::after{content:'';position:absolute;left:-20%;top:-20%;right:-20%;bottom:-20%;transform:translateX(-120%);
  background:linear-gradient(115deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.8) 50%,rgba(255,255,255,0) 60%)}
.logo.badge.pulse::after{animation:shine calc(.7s*var(--d)) ease-out}

/* shot clock: beat on every second in the last 5; flash on a violation */
@keyframes beat{from{transform:scale(1.16)}to{transform:scale(1)}}
@keyframes viol{0%{background:#fff;color:var(--low)}50%{background:var(--low);color:#fff}}
.shot.beat{animation:beat calc(.5s*var(--d)) ease-out}
.shot.viol{animation:viol calc(.3s*var(--d)) steps(1) 5}

/* buzzer: clock cell flashes and a red frame blinks round the bug */
@keyframes buzz{0%{background-color:var(--low);color:#fff}50%{background-color:var(--clock-bg);color:var(--low)}}
@keyframes frame{0%{opacity:1}50%{opacity:0}}
.clock.buzz{animation:buzz calc(.36s*var(--d)) steps(1) 6}
#bug::after{content:'';position:absolute;left:0;top:0;right:0;bottom:0;border:5px solid var(--low);border-radius:var(--radius);
  opacity:0;pointer-events:none;z-index:4}
#bug.buzz::after{animation:frame calc(.36s*var(--d)) steps(1) 6}

/* period label flips when the period changes */
#period.flip{animation:rollIn calc(.45s*var(--d)) cubic-bezier(.2,.9,.3,1.25)}

/* intro: clock column slides in, team rows wipe in, logos pop */
@keyframes inLeft{from{transform:translateX(-101%)}to{transform:none}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes pop{0%{transform:scale(0)}65%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shadowIn{from{box-shadow:0 0 0 rgba(0,0,0,0)}}
#bug.intro{animation:shadowIn calc(1.1s*var(--d)) ease-out}
#bug.intro .timecol{animation:inLeft calc(.6s*var(--d)) cubic-bezier(.2,.8,.2,1) both}
#bug.intro .row{animation:wipe calc(.6s*var(--d)) cubic-bezier(.2,.8,.2,1) both}
#bug.intro .row:nth-child(1){animation-delay:calc(.22s*var(--d))}
#bug.intro .row:nth-child(2){animation-delay:calc(.34s*var(--d))}
#bug.intro .logo{animation:pop calc(.5s*var(--d)) calc(.6s*var(--d)) both}
#bug.intro .score{animation:rollIn calc(.45s*var(--d)) calc(.8s*var(--d)) both}

/* ============================================================
   COUNTDOWN SCREEN (off air: pregame / halftime)
   Sits exactly where the scorebug sits (Look tab: position, size,
   distance from the edge) and uses the same fonts and colours.
     [ away team        | home team        ]   teams side by side
     [      TIP-OFF IN   14:59             ]   countdown underneath
   Halftime adds a HALFTIME band on top and each team's score.
   ============================================================ */
#cdwrap{position:absolute;width:730px}
#cd{position:relative;z-index:1;border-radius:var(--radius);overflow:hidden;
  font-family:var(--font),'Arial Narrow','Roboto Condensed',Impact,sans-serif;font-weight:700;
  box-shadow:0 10px 30px rgba(0,0,0,.45);
  transition:opacity calc(.35s*var(--d)),transform calc(.35s*var(--d))}
#cd.off{opacity:0;transform:translateY(22px)}
.cd-tag{display:none;height:46px;align-items:center;justify-content:center;gap:16px;position:relative;
  background:var(--accent);color:#111;font-size:30px;line-height:1;letter-spacing:.24em;text-transform:uppercase}
.cd-tag span{padding-left:.24em}
.cd-tag i{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.5}
#cd.half .cd-tag{display:flex}
.cd-teams{display:flex;height:112px}
.cd-team{flex:1;min-width:0;position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;color:var(--tx);
  background:linear-gradient(90deg,var(--c1),var(--c1d))}
.cd-team.r{flex-direction:row-reverse;background:linear-gradient(270deg,var(--c1),var(--c1d))}
.cd-team + .cd-team{border-left:2px solid rgba(0,0,0,.4)}
.cd-team .logo{width:66px;height:66px;margin-left:18px}
.cd-team.r .logo{margin-left:0;margin-right:18px}
.cd-team .mono{font-size:36px}
.cd-names{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding-right:14px}
.cd-team.r .cd-names{align-items:flex-end;padding-right:0;padding-left:14px}
.cd-abbr{display:inline-block;transform-origin:0 50%;font-size:54px;line-height:.95;white-space:nowrap;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.22)}
.cd-team.r .cd-abbr{transform-origin:100% 50%}
.cd-rec{margin-top:4px;font-size:17px;font-weight:600;white-space:nowrap;opacity:.9}
.cd-score{display:none;width:112px;flex:none;align-self:stretch;position:relative;overflow:hidden;align-items:center;justify-content:center;
  background:var(--c2);color:var(--tx2);font-size:76px;line-height:1}
#cd.half .cd-score{display:flex}
#cd.half .cd-rec{display:none}
.gloss .cd-team::before,.gloss .cd-score::before{content:'';position:absolute;left:0;right:0;top:0;height:55%;
  background:linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,0));pointer-events:none}
.cd-bar{height:100px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  background:var(--clock-bg);color:var(--clock-tx)}
.cd-in{display:flex;align-items:center;gap:28px;white-space:nowrap;transform-origin:50% 50%}   /* shrunk by the script if it is too wide */
.gloss .cd-bar{background-image:linear-gradient(rgba(255,255,255,.10),rgba(255,255,255,0) 60%)}
.cd-lab{font-size:30px;line-height:1;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;opacity:.72}
#cd.half .cd-lab{color:var(--accent);opacity:1}
.cd-time{font-size:82px;line-height:1;white-space:nowrap}
.cd-time .dg{display:inline-block;width:.52em;text-align:center}
.cd-time .pt{display:inline-block;width:.24em;text-align:center}
@keyframes cdHold{50%{opacity:.45}}
.cd-time.zero{animation:cdHold 1.6s ease-in-out infinite}
@keyframes wipeL{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
@keyframes inUp{from{transform:translateY(101%)}to{transform:none}}
@keyframes inDown{from{transform:translateY(-101%)}to{transform:none}}
#cd.intro{animation:shadowIn calc(1.1s*var(--d)) ease-out}
#cd.intro .cd-tag{animation:inDown calc(.45s*var(--d)) cubic-bezier(.2,.8,.2,1) both}
#cd.intro .cd-team{animation:wipe calc(.6s*var(--d)) calc(.1s*var(--d)) cubic-bezier(.2,.8,.2,1) both}
#cd.intro .cd-team.r{animation-name:wipeL;animation-delay:calc(.2s*var(--d))}
#cd.intro .cd-bar{animation:inUp calc(.5s*var(--d)) calc(.3s*var(--d)) cubic-bezier(.2,.8,.2,1) both}
#cd.intro .logo{animation:pop calc(.5s*var(--d)) calc(.6s*var(--d)) both}
#cd.intro .cd-score{animation:rollIn calc(.45s*var(--d)) calc(.75s*var(--d)) both}

/* ============================================================
   LOWER THIRD (name graphic)
   [ left name ][ logo block ][ right name ]   two commentators
                [ logo block ][ name / line 2 ] one person
   Enter: logo pops, bars wipe out from behind it, text fades in.
   Exit : the same steps in reverse. About 0.6 s each way.
   ============================================================ */
#lt{position:absolute;z-index:3;display:inline-grid;width:max-content;grid-template-columns:1fr auto 1fr;align-items:center;white-space:nowrap;
  pointer-events:none;font-family:var(--font),'Arial Narrow','Roboto Condensed',Impact,sans-serif}
#lt.solo{grid-template-columns:auto auto}
#lt.solo .ltL{display:none}
.ltlogo{position:relative;z-index:2;width:250px;height:92px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(var(--lt-logo-hi),var(--lt-logo));
  box-shadow:0 8px 22px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.12);
  transform:scale(0);opacity:0;
  transition:transform calc(.24s*var(--d)) cubic-bezier(.6,0,.8,.2) calc(.36s*var(--d)),opacity calc(.08s*var(--d)) linear calc(.52s*var(--d))}
.ltlogo img{width:186px;height:auto;display:block;filter:drop-shadow(0 2px 2px rgba(0,40,90,.28))}
.ltbar{position:relative;z-index:1;height:76px;min-width:300px;display:flex;align-items:center;justify-content:center;padding:0 46px;
  background:linear-gradient(var(--lt-bar-hi),var(--lt-bar));color:var(--lt-tx);
  box-shadow:0 8px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);
  transition:clip-path calc(.28s*var(--d)) cubic-bezier(.65,0,.25,1) calc(.12s*var(--d))}
.ltbar::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--lt-logo)}
.ltL{margin-right:-12px;padding-right:58px;border-radius:7px 0 0 7px;clip-path:inset(-40px 0 -40px 100%)}
.ltR{margin-left:-12px;padding-left:58px;border-radius:0 7px 7px 0;clip-path:inset(-40px 100% -40px 0)}
.ltL::after{border-radius:0 0 0 7px}
.ltR::after{border-radius:0 0 7px 0}
#lt.solo .ltR{min-width:360px;justify-content:flex-start}
#lt.hassub .ltbar{height:92px}
.lttxt{display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(7px);
  transition:opacity calc(.14s*var(--d)) ease,transform calc(.14s*var(--d)) ease}
#lt.solo .lttxt{align-items:flex-start}
.ltname{font-size:40px;font-weight:700;line-height:1;letter-spacing:.05em;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.ltsub{margin-top:6px;font-size:21px;font-weight:600;line-height:1;letter-spacing:.1em;text-transform:uppercase;color:var(--lt-sub)}
#lt.on .ltlogo{transform:scale(1);opacity:1;
  transition:transform calc(.32s*var(--d)) cubic-bezier(.2,1.5,.4,1) 0s,opacity calc(.06s*var(--d)) linear 0s}
#lt.on .ltbar{transition-delay:calc(.2s*var(--d))}
#lt.on .ltL,#lt.on .ltR{clip-path:inset(-40px -40px -40px -40px)}
#lt.on .lttxt{opacity:1;transform:none;
  transition:opacity calc(.2s*var(--d)) ease calc(.4s*var(--d)),transform calc(.2s*var(--d)) ease calc(.4s*var(--d))}
#lt.noanim *{transition:none!important}

/* ============================================================
   FULL-SCREEN GRAPHICS (starting lineups, schedule, standings)
   One panel at a time, centred inside the title-safe area
   (5% margin). Panels are deep navy, never pure black.
     --tc / --tc2  team colour and its darker shade
     --tca         accent for borders and glow (lightened if the team colour is dark)
     --gd          duration multiplier from the graphics Speed slider
     --i           row number, used to stagger the rows
   ============================================================ */
#gfx{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:2;display:flex;align-items:center;justify-content:center;
  padding:54px 96px;box-sizing:border-box;pointer-events:none;color:#f4f6fb;--gd:1;
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-family:var(--font),'Arial Narrow','Roboto Condensed',Impact,sans-serif;font-weight:700}
#gfx *{box-sizing:border-box}
.mode-control #gfx{left:50%;transform-origin:0 0;transform:translateX(-364.8px) scale(.38)}
.gp{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#161d2d,#0d1117);
  box-shadow:0 0 0 2px var(--tca),0 0 36px var(--glow),0 28px 70px rgba(0,0,0,.5);opacity:0;
  transition:opacity calc(.32s*var(--gd)) ease-in,transform calc(.32s*var(--gd)) ease-in,clip-path calc(.32s*var(--gd)) ease-in}
.gp-pair{display:flex;gap:36px;align-items:flex-start}

/* panel entrance / exit, one set per animation style */
#gfx[data-style=slide] .gp{transform:translateY(54px)}
#gfx[data-style=pop] .gp{transform:scale(.88)}
#gfx[data-style=wipe] .gp{opacity:1;clip-path:inset(-90px 100% -90px -90px)}
#gfx.on .gp{opacity:1;transform:none;
  transition:opacity calc(.45s*var(--gd)) ease-out,transform calc(.5s*var(--gd)) cubic-bezier(.2,.8,.2,1),clip-path calc(.55s*var(--gd)) cubic-bezier(.65,0,.25,1)}
#gfx[data-style=wipe].on .gp{clip-path:inset(-90px -90px -90px -90px)}
#gfx[data-style=pop].on .gp{transition-timing-function:ease-out,cubic-bezier(.2,1.5,.4,1),ease}

/* rows come in one by one after the panel */
.arow{opacity:0;transition:opacity calc(.2s*var(--gd)) ease,transform calc(.2s*var(--gd)) ease,clip-path calc(.2s*var(--gd)) ease}
#gfx[data-style=slide] .arow{transform:translateX(-48px)}
#gfx[data-style=pop] .arow{transform:scale(.82)}
#gfx[data-style=wipe] .arow{opacity:1;clip-path:inset(0 100% 0 0)}
#gfx.on .arow{opacity:1;transform:none;
  transition:opacity calc(.4s*var(--gd)) ease-out calc((.32s + var(--i)*.085s)*var(--gd)),
             transform calc(.45s*var(--gd)) cubic-bezier(.2,.8,.2,1) calc((.32s + var(--i)*.085s)*var(--gd)),
             clip-path calc(.45s*var(--gd)) cubic-bezier(.65,0,.25,1) calc((.32s + var(--i)*.085s)*var(--gd))}
#gfx[data-style=wipe].on .arow{clip-path:inset(0 0 0 0)}

/* shared header: logo block, title, small label */
.gp-head{display:flex;align-items:center;gap:26px;height:112px;padding-right:34px;
  background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border-bottom:3px solid var(--tca)}
.gp-logo{width:150px;height:112px;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(var(--tc),var(--tc2))}
.gp-logo img{max-width:100px;max-height:86px;object-fit:contain;display:block}
.gp-logo .mono{font-size:54px;line-height:1;color:var(--ttx)}
.gp-logo.usn{background:linear-gradient(var(--u1),var(--u2))}
.gp-logo.usn img{max-width:112px}
.gp-title{display:flex;flex-direction:column;min-width:0}
.gp-title b{font-size:58px;line-height:1;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gp-title span{margin-top:8px;font:600 21px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--tcl)}
.gp-rec{margin-left:auto;font-size:46px;line-height:1;white-space:nowrap}
.tlogo{width:60px;height:60px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:linear-gradient(var(--lc,#3b4558),var(--lc2,#252d3b));box-shadow:inset 0 0 0 2px rgba(255,255,255,.16)}
.tlogo img{max-width:74%;max-height:74%;object-fit:contain;display:block}
.tlogo .mono{font-size:28px;line-height:1;color:var(--ltx,#fff)}
.gbadge{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 14px;border-radius:8px;font-size:25px;line-height:1;letter-spacing:.05em;white-space:nowrap}

/* starting lineup */
.gp-lineup{width:1560px}
.gp-lineup.nocourt{width:1100px}
.gp-lineup.narrow{width:846px}
.gp-body{display:grid;grid-template-columns:minmax(0,1fr) 600px}
.nocourt .gp-body,.narrow .gp-body{grid-template-columns:minmax(0,1fr)}
.lu-rows{padding:12px 30px 16px;min-width:0}
.lu-row{display:flex;align-items:center;gap:24px;height:106px;border-bottom:1px solid rgba(255,255,255,.08)}
.lu-num{width:122px;height:84px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(var(--tc),var(--tc2));color:var(--ttx);font-size:66px;line-height:1;font-variant-numeric:tabular-nums}
.lu-num span{display:block;transform:scale(0);transition:transform calc(.15s*var(--gd)) ease}
#gfx.on .lu-num span{transform:scale(1);transition:transform calc(.34s*var(--gd)) cubic-bezier(.2,1.7,.4,1) calc((.52s + var(--i)*.085s)*var(--gd))}
.lu-main{flex:1;min-width:0}
.lu-name{font-size:50px;line-height:1;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.narrow .lu-name{font-size:44px}
.lu-extra{margin-top:9px;font:600 22px/1 var(--sans);letter-spacing:.04em;color:#aab4c5;white-space:nowrap}
.lu-extra i{font-style:normal;margin:0 10px;color:var(--tcl)}
.lu-pos{flex:none;min-width:64px;height:50px;padding:0 12px;border-radius:8px;border:2px solid var(--tca);display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1}
.lu-bench{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-top:14px;font:600 21px/1 var(--sans)}
.lu-bench b{margin-right:6px;font:700 24px/1 var(--font),'Arial Narrow',Impact,sans-serif;letter-spacing:.12em;color:var(--tcl)}
.lu-bench span{display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 7px;border-radius:8px;background:rgba(255,255,255,.07);white-space:nowrap}

.lu-court{position:relative;border-left:1px solid rgba(255,255,255,.08);background:radial-gradient(circle at 50% 100%,rgba(255,255,255,.08),rgba(255,255,255,0) 72%)}
.lu-courtbox{position:absolute;left:50%;top:50%;width:560px;height:520px;transform:translate(-50%,-50%)}

.lu-tag{display:flex;align-items:stretch;white-space:nowrap;border-radius:8px;overflow:hidden;background:#0b0f18;box-shadow:0 6px 16px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.12)}
.lu-tag b{min-width:52px;padding:8px 10px;text-align:center;font-size:30px;line-height:1;background:linear-gradient(var(--tc),var(--tc2));color:var(--ttx)}
.lu-tag span{display:flex;align-items:center;padding:0 12px;font-size:26px;line-height:1;letter-spacing:.03em;text-transform:uppercase}

/* schedule */
.gp-sched{width:1320px}
.sc-cols,.sc-row{display:grid;grid-template-columns:minmax(0,1fr) 250px 236px 120px;align-items:center;column-gap:20px;padding:0 34px}
.sc-cols,.st-cols{height:46px;font:600 16px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:#8b96aa;border-bottom:1px solid rgba(255,255,255,.1)}

.sc-ha{width:50px;flex:none;text-align:center;font-size:26px;line-height:1;color:var(--tcl)}
.sc-opp{font-size:42px;line-height:1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-when b{display:block;font-size:36px;line-height:1;white-space:nowrap}
.sc-when span{display:block;margin-top:6px;font:600 21px/1 var(--sans);color:#aab4c5;white-space:nowrap}
.sc-empty{padding:40px 34px;font:600 26px/1.3 var(--sans);color:#aab4c5}

/* standings */
.gp-stand{width:1260px}
.st-cols,.st-row{display:grid;grid-template-columns:76px minmax(0,1fr) 170px 170px 110px 120px;align-items:center;padding-right:30px;text-align:center}
.st-row{height:74px;font-size:36px;line-height:1;border-bottom:1px solid rgba(255,255,255,.07);font-variant-numeric:tabular-nums}
.st-rank{height:100%;display:flex;align-items:center;justify-content:center;font-size:34px;color:#8b96aa;background:rgba(255,255,255,.045)}
.st-team{display:flex;align-items:center;gap:16px;min-width:0;padding-left:18px;text-align:left}
.st-team .tlogo{width:52px;height:52px}
.st-name{font-size:40px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-strk.w{color:#5ee08a}
.st-strk.l{color:#ff8a8a}
.st-row.feat{background:linear-gradient(90deg,var(--tc),var(--tc2));color:var(--ttx)}
.st-row.feat .st-rank{background:rgba(0,0,0,.22);color:inherit}
.st-row.feat .st-strk{color:inherit}
@keyframes featPulse{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:inset 0 0 0 3px rgba(255,255,255,.7),inset 0 0 30px rgba(255,255,255,.25)}}
#gfx.on .st-row.feat{animation:featPulse calc(.9s*var(--gd)) ease-in-out calc(var(--pd)*var(--gd)) 2}

/* half-time report (full-screen graphic) */
.gp-ht{width:1500px}
.ht-top{display:grid;grid-template-columns:minmax(0,1fr) 270px minmax(0,1fr);height:118px}
.ht-team{display:flex;align-items:center;gap:20px;min-width:0;padding:0 30px;background:linear-gradient(var(--c1),var(--c2));color:var(--tx)}
.ht-team.r{flex-direction:row-reverse}
.ht-team .tlogo{width:78px;height:78px}
.ht-name{min-width:0;font-size:50px;line-height:1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht-score{display:flex;align-items:center;justify-content:center;gap:18px;font-size:86px;line-height:1;background:#0b0f18;font-variant-numeric:tabular-nums}
.ht-score i{font-style:normal;font-size:40px;color:#8b96aa}
.ht-rows{padding:10px 34px 8px}
.ht-row{display:grid;grid-template-columns:230px minmax(0,1fr) 210px minmax(0,1fr) 230px;align-items:center;column-gap:18px;height:56px;border-bottom:1px solid rgba(255,255,255,.07)}
.ht-row:last-child{border-bottom:0}
.ht-v{font-size:36px;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.ht-v.r{text-align:right}
.ht-v small{font:600 21px/1 var(--sans);color:#aab4c5;margin-left:10px}
.ht-v.r small{margin:0 10px 0 0}
.ht-lab{text-align:center;font:600 17px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:#aab4c5}
.ht-bar{height:12px;border-radius:6px;background:rgba(255,255,255,.08);display:flex;overflow:hidden}
.ht-bar.l{justify-content:flex-end}
.ht-bar b{display:block;height:100%;border-radius:6px;background:var(--bc);transform:scaleX(0);transition:transform calc(.2s*var(--gd)) ease}
.ht-bar.l b{transform-origin:right}
.ht-bar.r b{transform-origin:left}
#gfx.on .ht-bar b{transform:scaleX(1);transition:transform calc(.6s*var(--gd)) cubic-bezier(.2,.8,.2,1) calc((.5s + var(--i)*.085s)*var(--gd))}
.ht-keys{display:flex;gap:16px;padding:14px 34px 22px;border-top:1px solid rgba(255,255,255,.1)}
.ht-keys div{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:10px;background:rgba(255,255,255,.06);font:600 25px/1.25 var(--sans)}
.ht-keys b{flex:none;font:700 22px/1 var(--font),'Arial Narrow',Impact,sans-serif;letter-spacing:.14em;color:var(--tcl)}

/* ============================================================
   CONTROL PANEL STYLES
   ============================================================ */
#panel{background:#14171c;color:#e8eaee;font-size:14px;line-height:1.35}
#panel *{box-sizing:border-box}

.tab.on{background:#2f6fed;border-color:#2f6fed;color:#fff}

.btn{min-height:38px;padding:0 10px;border:1px solid #39404d;border-radius:8px;background:#262b35;color:#fff;font:600 14px/1.1 inherit;font-family:inherit;cursor:pointer}
.btn:hover{background:#303745}

.btn.primary{background:#2f6fed;border-color:#2f6fed}

.g4 .btn,.g3 .btn{padding:0 2px;white-space:nowrap;min-width:0}

kbd{display:inline-block;min-width:18px;padding:1px 5px;margin-left:4px;border:1px solid #4a5261;border-bottom-width:2px;border-radius:5px;
  background:#0f1216;color:#cfd5df;font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;text-align:center}
.grid{display:grid;gap:8px;margin-top:8px}

.big{font:700 46px/1 ui-monospace,Menlo,Consolas,monospace;margin:2px 0 8px}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#aab1bd}
.inline{display:flex;gap:8px;margin-top:8px}

.thead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;font-weight:700}

ol.tp{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.4}

<body>

<!-- The scoreboard itself -->
<div id="viewport">
  <div id="stage">
    <div id="bugwrap">
      <div id="strip" class="above"><div id="stripInner"></div></div>
      <div id="bug">
        <div class="timecol">
          <div class="clock" id="clockCell"><span id="clock"></span></div>
          <div class="meta">
            <span id="period">1ST</span>
            <span class="shot" id="shotCell"><span id="shot"></span></span>
          </div>
        </div>
        <div class="rows" id="rows"></div>
      </div>
    </div>
    <!-- Countdown screen for when we're off air: pregame / halftime (section 13) -->
    <div id="cdwrap">
      <div id="cd" class="off">
        <div class="cd-tag"><i></i><span>Halftime</span><i></i></div>
        <div class="cd-teams" id="cdTeams"></div>
        <div class="cd-bar" id="cdBar"><div class="cd-in" id="cdIn"><span class="cd-lab" id="cdLab"></span><span class="cd-time" id="cdTime"></span></div></div>
      </div>
    </div>
    <!-- Full-screen graphics: lineups, schedule, standings (filled in by the script) -->
    <div id="gfx"><div id="gfxPanel"></div></div>
    <!-- Lower third: commentator / player names -->
    <div id="lt">
      <div class="ltbar ltL"><span class="lttxt"><span class="ltname" id="ltN1"></span></span></div>
      <div class="ltlogo"><img id="ltImg" alt="USN"></div>
      <div class="ltbar ltR"><span class="lttxt"><span class="ltname" id="ltN2"></span><span class="ltsub" id="ltSub"></span></span></div>
    </div>
  </div>
</div>

<!-- The control panel (filled in by the script) -->
<aside id="panel"></aside>
<button id="panelToggle" class="btn sm" title="Show or hide the control panel (F2)">Controls</button>
<div id="toast"></div>

<script>
(function(){
'use strict';

/* ============================================================
   1. DEFAULTS
   Change these to change what a brand-new scoreboard starts with.
   Everything here can also be changed in the control panel.
   ============================================================ */
var KEY  = 'usn_scoreboard_v1';          // saved state
var PKEY = 'usn_scoreboard_presets_v1';  // saved presets
var CHAN = 'usn_scoreboard';             // channel between windows

function $(s,root){ return (root||document).querySelector(s); }
function $$(s,root){ return Array.prototype.slice.call((root||document).querySelectorAll(s)); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function getPath(o,p){ return p.split('.').reduce(function(a,k){ return a==null?a:a[k]; },o); }
function setPath(o,p,v){ var ks=p.split('.'), last=ks.pop(); ks.reduce(function(a,k){ return a[k]; },o)[last]=v; }
function merge(base,over){            // deep-merge saved data onto defaults so new settings get a value
  if(!over||typeof over!=='object') return base;
  Object.keys(base).forEach(function(k){
    if(over[k]===undefined) return;
    if(base[k]&&typeof base[k]==='object'&&!Array.isArray(base[k])) base[k]=merge(base[k],over[k]);
    else base[k]=over[k];
  });
  return base;
}
function hexRgb(h){ h=String(h||'#000').replace('#',''); if(h.length===3) h=h.replace(/(.)/g,'$1$1');
  var n=parseInt(h,16)||0; return [(n>>16)&255,(n>>8)&255,n&255]; }
function shade(hex,amt){               // amt -1..1 : negative = darker, positive = lighter
  var c=hexRgb(hex), t=amt<0?0:255, a=Math.abs(amt);
  return '#'+c.map(function(v){ return ('0'+Math.round(v+(t-v)*a).toString(16)).slice(-2); }).join('');
}
function contrast(hex){                // readable text colour on top of a background
  var c=hexRgb(hex).map(function(v){ v/=255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4); });
  return (0.2126*c[0]+0.7152*c[1]+0.0722*c[2])>0.45?'#111111':'#ffffff';
}
function retrigger(el,cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function other(t){ return t==='home'?'away':'home'; }

/* ============================================================
   3. MODE + STATE
   ============================================================ */
var qs = new URLSearchParams(location.search);
var mode = qs.get('view');
if(qs.has('output')) mode='overlay';                 // ...html?output  =  graphics only, no control panel
if(['overlay','control','combined'].indexOf(mode)<0) mode = window.obsstudio ? 'overlay' : 'combined';
var isAuthority = mode!=='overlay';     // pages with a control panel may change the game
var playsSound  = mode!=='control';     // sounds come from the page that shows the scoreboard
document.body.classList.add('mode-'+mode);

var S = load();                          // S = {stamp, gs, ss, settings, game}   gs / ss = stamp of the last game / settings change
function load(){
  var st=defaults(), saved=null;
  try{ saved=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(saved&&saved.settings) merge(st,saved.settings);
  var g=newGame(st);
  if(saved&&saved.game) merge(g,saved.game);
  var s0=(saved&&saved.stamp)||'0';
  return {stamp:s0, gs:(saved&&saved.gs)||s0, ss:(saved&&saved.ss)||s0, settings:st, game:g};
}

/* One shared clock. now() is this device's time plus a correction measured against the relay
   server, so a phone and a laptop agree on the moment the game clock was started. */
var OKEY='usn_scoreboard_offset_v1', timeOffset=0;
try{ timeOffset=parseInt(localStorage.getItem(OKEY),10)||0; }catch(e){}
function now(){ return Date.now()+timeOffset; }
function stamp(){ return now()+':'+Math.random().toString(36).slice(2,7); }
function stampTime(s){ return parseInt(s,10)||0; }
var settingsJSON=JSON.stringify(S.settings);   // to notice when the (large) settings really changed
var mine=[];                                   // stamps of changes made in this window

/* ---- talking to the other windows on this computer ---- */
var bc=null; try{ bc=new BroadcastChannel(CHAN); }catch(e){}
function saveLocal(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }
  catch(e){ toast('Could not save (storage full). Try smaller logos.'); }
}
function bcState(){ if(bc) bc.postMessage({type:'state',S:S}); }
function publish(){ saveLocal(); bcState(); }
function incoming(next){
  if(!next||!next.settings||!next.game||next.stamp===S.stamp) return;
  if(relay.cfg&&relay.ok&&relay.cache) return;        // connected to a remote room: the room is the single source of truth
  var old=S;
  S={stamp:next.stamp,gs:next.gs||next.stamp,ss:next.ss||next.stamp,
     settings:merge(defaults(),next.settings),game:merge(newGame(defaults()),next.game)};
  settingsJSON=JSON.stringify(S.settings);
  render(old.game);
}
if(bc) bc.onmessage=function(e){
  var m=e.data||{};
  if(m.type==='state') incoming(m.S);
  else if(m.type==='hello'&&isAuthority){ bcState(); bcRelay(); bc.postMessage({type:'lib',LIB:LIB,LOGOS:LOGOS}); }   // a display just opened: send it everything
  else if(m.type==='ping'&&!isAuthority&&m.stamp!==S.stamp) bc.postMessage({type:'hello'});
  else if(m.type==='relay'&&!isAuthority) adoptRelay(m);
  else if(m.type==='lib'){ if(!(relay.cfg&&relay.ok&&relay.cache)) adoptLib(m.LIB,m.LOGOS); }   // team library changed
};
window.addEventListener('storage',function(e){        // fallback when BroadcastChannel is not available
  if(e.key===KEY&&e.newValue){ try{ incoming(JSON.parse(e.newValue)); }catch(_){} }
});
if(bc&&!isAuthority) bc.postMessage({type:'hello'});
if(bc&&isAuthority) setInterval(function(){ bc.postMessage({type:'ping',stamp:S.stamp}); },2000);

/* ---- every change to the game or settings goes through commit() ---- */
function commit(fn){
  var oldGame=clone(S.game);
  fn(S.settings,S.game);
  S.stamp=S.gs=stamp();
  var sj=JSON.stringify(S.settings), changed=sj!==settingsJSON;
  if(changed){ settingsJSON=sj; S.ss=S.stamp; mine.push(S.ss); if(mine.length>40) mine.shift(); }
  publish();
  if(relay.cfg){ queueGame(oldGame); if(changed){ relay.mySettings=S.ss; sendSettings(); } }
  render(oldGame);
}

/* ============================================================
   3b. REMOTE CONTROL (internet relay)
   Optional. When it is on, the game and the settings are also
   written to a Firebase Realtime Database "room", and every
   device in that room listens for changes. Nothing here runs
   until a database address and room code are entered in the
   Remote tab (or arrive in the link: ?db=...&room=...).
     <db>/usn/<room>/game      one flat list of fields ("score-home": 12, ...). Each change sends
                               only the fields it touched, so two devices can work at once.
     <db>/usn/<room>/settings  large (logos), sent whole and only when it changes
     <db>/usn/<room>/lib       the team library (rosters, schedules, standings), sent whole when it changes
     <db>/usn/<room>/logos     the library teams' logos, sent only when a logo changes
   ============================================================ */
var RKEY='usn_scoreboard_relay_v1';
var clientId=Math.random().toString(36).slice(2,10);
var relay={cfg:null,es:null,ok:false,err:'',fails:0,mySettings:'',retry:0,
           cache:null,      // copy of the room's game fields as the server has them
           pending:[],      // my changes the server has not confirmed yet
           busy:false};

function cleanDb(v){
  v=String(v||'').trim(); if(!v) return '';
  if(!/^https?:\/\//i.test(v)) v='https://'+v;
  try{ var u=new URL(v), local=(u.hostname==='localhost'||u.hostname==='127.0.0.1');
       if(u.protocol!=='https:'&&!local) return ''; return u.origin; }catch(e){ return ''; }
}
function cleanRoom(v){ v=String(v||'').trim().replace(/[^A-Za-z0-9_-]/g,''); return v.length>=4?v.slice(0,40):''; }
function randomRoom(){
  var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', out='', a=new Uint8Array(10);
  if(window.crypto&&crypto.getRandomValues) crypto.getRandomValues(a); else for(var j=0;j<a.length;j++) a[j]=Math.floor(Math.random()*256);
  for(var i=0;i<a.length;i++) out+=c.charAt(a[i]%c.length);
  return out;
}
function roomUrl(path){ return relay.cfg.db+'/usn/'+relay.cfg.room+(path||'')+'.json'; }
function parseNode(v){ if(typeof v!=='string') return null; try{ return JSON.parse(v); }catch(e){ return null; } }

function setRelay(cfg,quiet){            // turn remote control on (cfg) or off (null)
  relay.cfg=cfg;
  if(isAuthority){ try{ if(cfg) localStorage.setItem(RKEY,JSON.stringify(cfg)); else localStorage.removeItem(RKEY); }catch(e){} }
  if(!quiet) bcRelay();
  relayStop(); if(cfg) relayStart();
  syncRemote(); relayStatus();
}
function bcRelay(){ if(bc&&isAuthority) bc.postMessage({type:'relay',cfg:relay.cfg,offset:timeOffset}); }
function adoptRelay(m){                  // an overlay on this computer keeps following the control panel directly;
  if(relay.cfg) return;                  // it only copies the panel's time correction so both clocks agree
  if(typeof m.offset==='number'&&m.offset!==timeOffset){ timeOffset=m.offset; lastClockText=null; }
}
function relayStop(){
  if(relay.es){ relay.es.close(); relay.es=null; }
  clearTimeout(relay.retry); relay.ok=false; relay.err=''; relay.fails=0; relay.cache=null; relay.pending=[];
}
function relayStart(){
  if(!relay.cfg) return;
  if(!window.EventSource){ relay.err='This browser cannot use remote control.'; return; }
  var es=relay.es=new EventSource(roomUrl(''));
  es.onopen=function(){ relay.ok=true; relay.err=''; relayStatus(); measureOffset(); };
  es.onerror=function(){
    relay.ok=false;
    if(es.readyState===2){             // refused (wrong address or rules): try again in a while
      relay.err='Could not connect. Check the database address and its rules.';
      clearTimeout(relay.retry);
      relay.retry=setTimeout(function(){ if(relay.es===es){ es.close(); relay.es=null; relayStart(); relayStatus(); } },15000);
    } else relay.err='Connection lost. Trying again…';
    relayStatus();
  };
  es.addEventListener('put',function(e){
    var d; try{ d=JSON.parse(e.data); }catch(_){ return; }
    if(!d) return;
    if(d.path==='/') onRoom(d.data||{});                               // sent each time we (re)connect: the whole room
    else if(d.path==='/settings') applyRemote(parseNode(d.data));
    else if(d.path==='/lib') applyRemoteLib('lib',parseNode(d.data));
    else if(d.path==='/logos') applyRemoteLib('logos',parseNode(d.data));
    else if(d.path==='/game'){ relay.cache=(d.data&&typeof d.data==='object')?d.data:{}; confirmed(relay.cache.stamp); rebuild(); }
    else if(d.path.indexOf('/game/')===0&&relay.cache){ relay.cache[d.path.slice(6)]=d.data; rebuild(); }
  });
  es.addEventListener('patch',function(e){                             // some fields of the game changed
    var d; try{ d=JSON.parse(e.data); }catch(_){ return; }
    if(!d||d.path!=='/game'||!d.data||!relay.cache) return;
    Object.keys(d.data).forEach(function(k){ relay.cache[k]=d.data[k]; });
    confirmed(d.data.stamp); rebuild();
  });
  es.addEventListener('cancel',function(){ relay.ok=false; relay.err='The database refused the connection. Check its rules.'; relayStatus(); });
}
function onRoom(data){
  /* The computer where "Connect" was clicked is the host. If its copy is newer than the room's
     (or the room is empty) it fills the room; otherwise everyone takes what is in the room. */
  var host=isAuthority&&relay.cfg&&relay.cfg.host;
  var rs=parseNode(data.settings);
  if(rs&&rs.stamp){ if(host&&stampTime(S.ss)>stampTime(rs.stamp)) sendSettings(); else applyRemote(rs); }
  else if(host) sendSettings();
  [['lib',LIB.stamp,sendLib],['logos',LOGOS.stamp,sendLogos]].forEach(function(k){        // team library and its logos, same rule
    var r=parseNode(data[k[0]]);
    if(r&&r.stamp){ if(host&&stampTime(k[1])>stampTime(r.stamp)) k[2](); else applyRemoteLib(k[0],r); }
    else if(host) k[2]();
  });
  var rg=(data.game&&typeof data.game==='object')?data.game:null;
  relay.cache=rg||{};
  if(host&&(!rg||!rg.stamp||stampTime(S.gs)>stampTime(rg.stamp))){ relay.pending=[]; putGame(); }
  else{ relay.pending=relay.pending.filter(function(p){ return !p.sent; }); rebuild(); pump(); }   // what was sent is already in the room
}
function applyRemote(o){                 // settings arrive whole
  if(!o||!o.stamp||!o.settings) return;
  if(o.stamp===S.ss) return;                                           // already have it
  if(mine.indexOf(o.stamp)>=0&&o.stamp!==relay.mySettings) return;     // an echo of my own older change
  S.settings=merge(defaults(),o.settings); S.ss=o.stamp; settingsJSON=JSON.stringify(S.settings);
  S.stamp=stamp();
  if(isAuthority){ saveLocal(); bcState(); }
  render(S.game);
}

/* ---- the game travels as a flat list of fields ---- */
function flatten(o,pre,out){             // {score:{home:2}} -> {"score-home":2}   ('' travels as '~')
  out=out||{};
  Object.keys(o).forEach(function(k){ var v=o[k], key=pre?pre+'-'+k:k;
    if(v&&typeof v==='object') flatten(v,key,out); else out[key]=(v==='')?'~':v; });
  return out;
}
function unflatten(f){
  var o={};
  Object.keys(f).forEach(function(key){
    if(key==='stamp') return;
    var ks=key.split('-'), n=o, v=f[key];
    for(var i=0;i<ks.length-1;i++){ if(!n[ks[i]]||typeof n[ks[i]]!=='object') n[ks[i]]={}; n=n[ks[i]]; }
    n[ks[ks.length-1]]=(v==='~')?'':v;
  });
  return o;
}
function queueGame(oldGame){             // work out which fields this change touched and send just those
  var a=flatten(oldGame), b=flatten(S.game), patch={}, n=0;
  Object.keys(b).forEach(function(k){ if(a[k]!==b[k]){ patch[k]=b[k]; n++; } });
  if(!n) return;
  patch.stamp=S.gs;
  relay.pending.push({stamp:S.gs,patch:patch,sent:0});
  pump();
}
function pump(){                         // one request at a time; changes made meanwhile go out together in the next one
  var R=relay; if(R.busy||!R.cfg) return;
  var todo=R.pending.filter(function(p){ return !p.sent; }); if(!todo.length) return;
  var body={}; todo.forEach(function(p){ Object.keys(p.patch).forEach(function(k){ body[k]=p.patch[k]; }); });
  R.busy=true;
  fetch(roomUrl('/game'),{method:'PATCH',body:JSON.stringify(body)})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); R.fails=0; var t=Date.now(); todo.forEach(function(p){ p.sent=t; }); })
    .catch(function(){ R.fails++; })
    .then(function(){ R.busy=false; relayStatus(); if(R.cfg) setTimeout(pump,R.fails?2000:0); });
}
function putGame(){                      // replace the room's whole game with mine (host only, when connecting)
  if(!relay.cfg) return;
  var body=flatten(S.game); body.stamp=S.gs;
  fetch(roomUrl('/game'),{method:'PUT',body:JSON.stringify(body)})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); relay.fails=0; })
    .catch(function(){ relay.fails++; setTimeout(function(){ if(relay.cfg&&relay.ok) putGame(); },2000); })
    .then(relayStatus);
}
function confirmed(st){                    // the server has echoed one of my changes: it and everything before it is done
  var P=relay.pending, i, t=Date.now();
  for(i=P.length-1;i>=0;i--) if(P[i].stamp===st){ P.splice(0,i+1); break; }
  relay.pending=relay.pending.filter(function(p){ return !p.sent||t-p.sent<8000; });   // never wait forever for an echo
}
function rebuild(){                      // what to show = the server's copy + my changes it has not confirmed yet
  var R=relay; if(!R.cache) return;
  var view={};
  Object.keys(R.cache).forEach(function(k){ view[k]=R.cache[k]; });
  R.pending.forEach(function(p){ Object.keys(p.patch).forEach(function(k){ view[k]=p.patch[k]; }); });
  if(!view.stamp) return;
  var g=merge(newGame(defaults()),unflatten(view));
  if(JSON.stringify(g)===JSON.stringify(S.game)){ S.gs=view.stamp; return; }
  var old=S.game; S.game=g; S.gs=view.stamp; S.stamp=stamp();
  if(isAuthority){ saveLocal(); bcState(); }
  render(old);
}
function makeSender(node,build){         // one request at a time, always sending the latest copy
  var busy=false, dirty=false;
  function go(){
    if(!relay.cfg) return;
    if(busy){ dirty=true; return; }
    busy=true; dirty=false;
    fetch(roomUrl('/'+node),{method:'PUT',body:JSON.stringify(JSON.stringify(build()))})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); relay.fails=0; })
      .catch(function(){ relay.fails++; dirty=true; })
      .then(function(){ busy=false; relayStatus(); if(dirty&&relay.cfg) setTimeout(go,relay.fails?2000:0); });
  }
  return go;
}
var sendSettings=makeSender('settings',function(){ return {stamp:S.ss,settings:S.settings}; });

function measureOffset(){                // ask the server what time it is, four times, and keep the quickest answer
  if(!relay.cfg) return;
  var best=null, n=0, url=roomUrl('/time/'+clientId);
  (function ping(){
    if(!relay.cfg) return;
    var a=Date.now(), b=0;
    fetch(url,{method:'PUT',body:'{".sv":"timestamp"}'})
      .then(function(r){ b=Date.now(); return r.json(); })
      .then(function(v){ return (typeof v==='number')?v:fetch(url).then(function(r){ return r.json(); }); })
      .then(function(ts){ if(typeof ts==='number'&&(!best||b-a<best.rtt)) best={rtt:b-a,off:ts-(a+b)/2}; })
      .catch(function(){})
      .then(function(){
        if(++n<4){ setTimeout(ping,250); return; }
        if(!best) return;
        var o=Math.round(best.off);
        if(Math.abs(o-timeOffset)>30){ timeOffset=o; try{ localStorage.setItem(OKEY,String(o)); }catch(e){} lastClockText=null; }
        bcRelay();
      });
  })();
}
setInterval(function(){ if(relay.cfg&&relay.ok) measureOffset(); },600000);

function shareLink(){
  var c=relay.cfg; if(!c) return '';
  var base=(c.page||'').trim()||(/^http/.test(location.protocol)?location.origin+location.pathname:'');
  if(!base) return '';
  base=base.split('?')[0].split('#')[0];
  return base+'?view=control&db='+encodeURIComponent(c.db)+'&room='+encodeURIComponent(c.room);
}
function relayStatus(){
  var o=panelOut; if(!o||!o.netText) return;
  var c=relay.cfg, text, cls='off';
  if(!c) text='Remote control is off. Only this computer can run the scoreboard.';
  else if(relay.ok&&!relay.fails){ text='Connected to room '+c.room+'.'; cls='ok'; }
  else if(relay.ok){ text='Connected, but the last change has not gone through yet. Trying again…'; cls='bad'; }
  else { text=relay.err||'Connecting…'; cls='bad'; }
  o.netText.textContent=text; o.netText.className='note net-'+cls;
  o.netDot.hidden=!c; o.netDot.className='netdot '+cls; o.netDot.textContent=(cls==='ok')?'● Remote on':'● Remote: not connected';
  o.shareLink.textContent=shareLink()||(c?'Fill in "Web address of the hosted page", then press Connect again.':'Connect first.');
}
function syncRemote(){
  if(!isAuthority||!$('#rDb')) return;
  var c=relay.cfg||{}, f=document.activeElement;
  [['#rDb',c.db],['#rRoom',c.room],['#rPage',c.page]].forEach(function(x){ var n=$(x[0]); if(n!==f&&x[1]!==undefined) n.value=x[1]||''; });
  if(!$('#rRoom').value) $('#rRoom').value=randomRoom();
}
function relayInit(){
  var cfg=null, db=cleanDb(qs.get('db')), room=cleanRoom(qs.get('room'));
  if(db&&room) cfg={db:db,room:room,page:/^http/.test(location.protocol)?location.origin+location.pathname:'',host:false};   // opened from a shared link
  else if(isAuthority){ try{ cfg=JSON.parse(localStorage.getItem(RKEY)); }catch(e){} if(cfg&&(!cleanDb(cfg.db)||!cleanRoom(cfg.room))) cfg=null; }
  if(cfg) setRelay(cfg); else { syncRemote(); relayStatus(); }
}

/* ============================================================
   4. CLOCK MATHS
   A running clock stores the time left when it started plus the
   moment it started. Time left is always worked out from the
   real clock, so it cannot drift.
   ============================================================ */
function rem(c){ return c.running ? Math.max(0,c.ms-(now()-c.t0)) : c.ms; }
function freeze(c){ c.ms=rem(c); c.running=false; }
function run(c){ if(c.ms>0){ c.t0=now(); c.running=true; } }
function periodLen(rules,p){ return (p<=rules.periods?rules.periodMin:rules.otMin)*60000; }
function fmtClock(ms){
  if(ms>59900){ var s=Math.ceil(ms/1000); return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2); }
  return (Math.ceil(ms/100)/10).toFixed(1);                 // tenths under a minute
}
function parseClock(txt){              // "8:00", "45", "45.3"  ->  milliseconds (or null)
  txt=String(txt).trim(); if(!txt) return null;
  var m=txt.match(/^(\d+):(\d{1,2})(\.\d)?$/), v;
  if(m) v=(+m[1])*60000+(+m[2])*1000+(m[3]?(+m[3])*1000:0);
  else if(/^\d+(\.\d+)?$/.test(txt)) v=parseFloat(txt)*1000;
  else return null;
  return Math.max(0,Math.round(v));
}
var ORD=['1ST','2ND','3RD','4TH','5TH','6TH','7TH','8TH'];
function periodLabel(p){
  var n=S.settings.rules.periods;
  if(p<=n) return ORD[p-1]||(p+'TH');
  return (p-n===1)?'OT':(p-n)+'OT';
}
function unitName(){ var n=S.settings.rules.periods; return n===4?'QUARTER':n===2?'HALF':'PERIOD'; }
function endText(){                    // banner when the game clock hits zero
  var p=S.game.period, n=S.settings.rules.periods;
  if(p<n) return (n%2===0&&p===n/2)?'HALFTIME':'END OF '+periodLabel(p)+' '+unitName();
  if(p===n) return 'END OF REGULATION';
  return 'END OF '+periodLabel(p);
}
function startText(){                  // banner when a new period starts
  var p=S.game.period, n=S.settings.rules.periods;
  if(p<=n) return periodLabel(p)+' '+unitName();
  return (p-n===1)?'OVERTIME':ORD[p-n-1]+' OVERTIME';
}

/* ============================================================
   5. ACTIONS  (what the buttons and keys do)
   ============================================================ */
function fx(g,type,team,pts){ g.fx={n:g.fx.n+1,type:type,team:team||'',pts:pts||0,at:now()}; }
var ACT = {
  score:function(t,n){ n=+n; commit(function(st,g){
    var before=g.score[t]; g.score[t]=Math.max(0,before+n);
    if(n>0) fx(g,'score',t,n);
  });},
  foul:function(t,n){ commit(function(st,g){ g.fouls[t]=Math.max(0,g.fouls[t]+(+n)); }); },
  timeoutAdd:function(t,n){ commit(function(st,g){ g.timeouts[t]=Math.max(0,g.timeouts[t]+(+n)); }); },
  timeout:function(t){ commit(function(st,g){                 // call a timeout: use one, stop the clocks, show the banner
    if(g.timeouts[t]>0) g.timeouts[t]--;
    freeze(g.clock); freeze(g.shot); fx(g,'timeout',t);
  });},
  poss:function(t){ commit(function(st,g){ g.possession=(g.possession===t)?'':t; }); },
  possSwitch:function(){ commit(function(st,g){ g.possession=(g.possession==='home')?'away':'home'; }); },
  clockToggle:function(){ commit(function(st,g){
    if(g.clock.running){ freeze(g.clock); freeze(g.shot); }
    else{ freeze(g.clock); if(g.clock.ms<=0) return; run(g.clock);
          if(st.rules.shotOn&&st.rules.shotLinked){ freeze(g.shot); run(g.shot); } }
  });},
  clockNudge:function(s){ commit(function(st,g){ setClock(g.clock,rem(g.clock)+(+s)*1000); }); },
  clockSet:function(){ var el=$('#setClock'), v=parseClock(el.value);

  if(AC.state==='suspended') AC.resume(); return AC; }
function tone(o){
  var a=audio(); if(!a) return;
  var t=a.currentTime+(o.t||0), osc=a.createOscillator(), g=a.createGain(), v=(o.g||0.2)*S.settings.sound.vol;
  osc.type=o.type||'sine'; osc.frequency.setValueAtTime(o.f,t);
  if(o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2,t+o.d);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+0.01);
  g.gain.setValueAtTime(v,t+o.d-0.04); g.gain.linearRampToValueAtTime(0,t+o.d);
  osc.connect(g); g.connect(a.destination); osc.start(t); osc.stop(t+o.d+0.02);

    var gh=document.createElement('span'); gh.className='ghost'; gh.textContent=oldText; r.scorecell.appendChild(gh);
    setTimeout(function(){ gh.remove(); },450*D());
    retrigger(r.score,'in'); r.scorecell.classList.remove('flash','flash3'); retrigger(r.scorecell,pts>=3?'flash3':'flash');
    retrigger(r.teamcell,'lift');
  }
  if(A.logo) retrigger(r.logo,'pulse');
  if(pts>=3&&A.three) retrigger(r.sweep,'go');
  sfx(pts>=3?'three':'score');
}

/* ---- the 60fps loop: only the clocks change every frame ---- */
var lastClockText=null, lastShotText=null, lastCr=null, lastSr=null;
function setDigits(node,text){          // fixed-width digits so the clock does not wobble
  var html='';
  for(var i=0;i<text.length;i++){ var c=text.charAt(i); html+='<span class="'+((c===':'||c==='.')?'pt':'dg')+'">'+c+'</span>'; }
  node.innerHTML=html;
}
function tick(){
  var st=S.settings, g=S.game, cr=rem(g.clock), sr=rem(g.shot);
  var ct=fmtClock(cr);
  if(ct!==lastClockText){ lastClockText=ct; setDigits(el.clock,ct); if(panelOut.clock) panelOut.clock.textContent=ct; }
  el.clockCell.classList.toggle('low',st.anim.clockRed&&cr<60000);
  var blank=cr>0&&sr>cr+50;             // more shot clock than game clock left: the shot clock is off
  var stx=blank?'':String(Math.ceil(sr/1000));
  if(stx!==lastShotText){
    lastShotText=stx; el.shot.textContent=stx; if(panelOut.shot) panelOut.shot.textContent=stx||'off';
    var low=st.anim.shot&&!blank&&sr<=5000;
    el.shotCell.classList.toggle('low',low);
    if(low&&sr>0&&g.shot.running) retrigger(el.shotCell,'beat');
  }
  if(lastCr!==null){                    // a clock just ran out (not "was typed in as zero")
    if(cr===0&&lastCr>0&&lastCr<1500) fxBuzzer(false);
    else if(sr===0&&lastSr>0&&lastSr<1500&&st.rules.shotOn&&cr>0) fxShotViolation();
  }
  lastCr=cr; lastSr=sr;
  cdTick();
  requestAnimationFrame(tick);
}
function authorityCheck(){              // the control side records that a clock has stopped at zero
  if(!isAuthority) return;
  var g=S.game;
  if(g.clock.running&&rem(g.clock)<=0){ commit(function(st,gg){ gg.clock={running:false,ms:0,t0:0}; freeze(gg.shot); possFlush(gg); }); halfCheck(); }
  else if(g.shot.running&&rem(g.shot)<=0) commit(function(st,gg){ gg.shot={running:false,ms:0,t0:0}; });
}
setInterval(authorityCheck,50);

function settingChanged(t){
  var v;
  if(t.type==='checkbox') v=t.checked;
  else if(t.type==='number'||t.type==='range'){ v=parseFloat(t.value); if(isNaN(v)) return;
    if(t.min!=='') v=Math.max(+t.min,v); if(t.max!=='') v=Math.min(+t.max,v); }
  else v=t.value;
  var oldR=clone(S.settings.rules), m=t.dataset.set.match(/^teams\.(home|away)\.color$/);
  commit(function(st,g){
    if(m){ var T=st.teams[m[1]]; if(T.color2===shade(T.color,SHADE)) T.color2=shade(v,SHADE); }   // score box follows the team colour until you pick your own
    setPath(st,t.dataset.set,v);
    var r=st.rules;                      // keep an untouched clock in step with the new rule
    if(!g.clock.running&&g.clock.ms===periodLen(oldR,g.period)) g.clock.ms=periodLen(r,g.period);
    if(!g.shot.running&&g.shot.ms===oldR.shotSec*1000) g.shot.ms=r.shotSec*1000;
    TEAMS.forEach(function(x){ if(g.timeouts[x]===oldR.timeouts) g.timeouts[x]=r.timeouts; });
  });
}

function syncPanel(){                   // copy the current state into the panel (but never into the box being typed in)

/* ---- logos, presets, import/export ---- */
function readLogo(file,team,input){
  if(!file) return;
  var fr=new FileReader();
  fr.onload=function(){
    var raw=fr.result, img=new Image();
    img.onload=function(){
      var w=img.naturalWidth, h=img.naturalHeight, out=raw;
      if(w&&h){ var k=Math.min(1,256/Math.max(w,h)), c=document.createElement('canvas');     // shrink big images
        c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(h*k));
        try{ c.getContext('2d').drawImage(img,0,0,c.width,c.height); out=c.toDataURL('image/png'); }catch(e){ out=raw; } }
      if(out.length>900000){ toast('That image is too big. Try a smaller one.'); return; }
      commit(function(st){ st.teams[team].logo=out; }); if(input) input.value='';
    };
    img.onerror=function(){ toast('Could not read that image'); };
    img.src=raw;
  };
  fr.readAsDataURL(file);
}
function presets(){ try{ return JSON.parse(localStorage.getItem(PKEY))||[]; }catch(e){ return []; } }
function savePresets(list){ try{ localStorage.setItem(PKEY,JSON.stringify(list)); }catch(e){ toast('Storage is full. Delete a preset first.'); } renderPresets(); }
function renderPresets(){
  var box=$('#presetList'); if(!box) return; box.textContent='';
  presets().forEach(function(p,i){
    var row=document.createElement('div'); row.className='pitem';
    var name=document.createElement('span'); name.textContent=p.name; row.appendChild(name);
    row.insertAdjacentHTML('beforeend','<button class="btn sm primary" data-act="presetLoad:'+i+'">Load</button><button class="btn sm warn" data-act="presetDelete:'+i+'">Delete</button>');
    box.appendChild(row);
  });
  if(!box.firstChild) box.innerHTML='<p class="note" style="margin:0">No presets yet.</p>';
}
function importFile(file,input){
  if(!file) return;
  var fr=new FileReader();
  fr.onload=function(){
    try{ var d=JSON.parse(fr.result);
      if(Array.isArray(d.presets)){ var names={}, list=presets().concat(d.presets).reverse().filter(function(p){ if(!p||!p.name||names[p.name]) return false; names[p.name]=1; return true; }).reverse(); savePresets(list); }
      if(d.settings) commit(function(){ S.settings=merge(defaults(),d.settings); });
      if(d.lib&&Array.isArray(d.lib.teams)){ var nl=normalizeLib(d.lib), lg=(d.logos&&d.logos.map)?d.logos.map:null; libEditId=nl.sel;
        libCommit(function(){ LIB=nl; if(lg) LOGOS.map=lg; },true,!!lg); }
      toast('Imported');
    }catch(e){ toast('That file is not a scoreboard settings file'); }
    input.value='';
  };
  fr.readAsText(file);
}

/* ---- every change to the library goes through libCommit() ---- */
function libCommit(fn,structural,logosChanged){
  fn(LIB);
  LIB.stamp=stamp(); mine.push(LIB.stamp);
  if(logosChanged){ LOGOS.stamp=LIB.stamp; saveLogos(); }
  if(mine.length>40) mine.shift();
  saveLib();
  if(bc) bc.postMessage({type:'lib',LIB:LIB,LOGOS:logosChanged?LOGOS:null});
  if(relay.cfg){ relay.myLib=LIB.stamp; sendLib(); if(logosChanged){ relay.myLogos=LOGOS.stamp; sendLogos(); } }
  libChanged(structural);
}
function adoptLib(lib,logos){           // a copy arrived from another window on this computer
  var changed=false;
  if(lib&&Array.isArray(lib.teams)&&lib.stamp!==LIB.stamp){ LIB=normalizeLib(lib); changed=true; }
  if(logos&&logos.map&&logos.stamp!==LOGOS.stamp){ LOGOS=logos; changed=true; }
  if(changed) libChanged(true);
}
function applyRemoteLib(kind,o){         // a copy arrived from the remote room
  if(!o||!o.stamp) return;
  var cur=(kind==='lib')?LIB.stamp:LOGOS.stamp, newest=(kind==='lib')?relay.myLib:relay.myLogos;
  if(o.stamp===cur) return;
  if(mine.indexOf(o.stamp)>=0&&o.stamp!==newest) return;               // an echo of my own older change
  if(kind==='lib'){ if(!Array.isArray(o.teams)) return; LIB=normalizeLib(o); if(isAuthority) saveLib(); }
  else{ if(!o.map) return; LOGOS=o; if(isAuthority) saveLogos(); }
  if(isAuthority&&bc) bc.postMessage({type:'lib',LIB:LIB,LOGOS:(kind==='logos')?LOGOS:null});
  libChanged(true);
}

/* ============================================================
   12. STATS AND HALF-TIME REPORT
   One person logs each play with one tap in the Stats tab. The
   page works out points, percentages and possession by
   itself, and builds a half-time report with talking points.

   Everything lives in game.st, so it travels with the score to the
   other windows and the remote room, and resets with New game.
   Possession rules: made shot or turnover -> ball to the other team.
   After a miss the ball stays put until someone taps Switch (or a
   team's button) for the rebound.
   Possession time is counted in game-clock time, not real time.
   ============================================================ */
function freshTeamStats(){ return {fg2m:0,fg2a:0,fg3m:0,fg3a:0,ftm:0,fta:0,oreb:0,dreb:0,ast:0,stl:0,blk:0,to:0,pf:0,tol:0}; }
function freshStats(){ return {home:freshTeamStats(),away:freshTeamStats(),poss:{team:'',rem:0,per:1,nhome:0,naway:0,mshome:0,msaway:0},last:''}; }

var STAT={                               // what each button records
  m2:{lab:'made 2',     f:['fg2m','fg2a'], pts:2, poss:'opp'},
  x2:{lab:'missed 2',   f:['fg2a']},
  m3:{lab:'made 3',     f:['fg3m','fg3a'], pts:3, poss:'opp'},
  x3:{lab:'missed 3',   f:['fg3a']},
  mf:{lab:'made free throw',   f:['ftm','fta'], pts:1, poss:'opp'},
  xf:{lab:'missed free throw', f:['fta']},
  as:{lab:'assist',     f:['ast']},
  to:{lab:'turnover',   f:['to'],  poss:'opp'},
  pf:{lab:'foul',       f:['pf']},
  tm:{lab:'timeout',    f:['tol']}
};
function pct(m,a){ return a?Math.round(m*100/a):null; }
function derive(s){
  var fgm=s.fg2m+s.fg3m, fga=s.fg2a+s.fg3a;
  return {pts:s.fg2m*2+s.fg3m*3+s.ftm, fgm:fgm, fga:fga, fgp:pct(fgm,fga), tpm:s.fg3m, tpa:s.fg3a, tpp:pct(s.fg3m,s.fg3a),
          ftm:s.ftm, fta:s.fta, ftp:pct(s.ftm,s.fta), reb:s.oreb+s.dreb, oreb:s.oreb, dreb:s.dreb,
          ast:s.ast, stl:s.stl, blk:s.blk, to:s.to, pf:s.pf};
}
function mmss(ms){ var s=Math.round(ms/1000); return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2); }
function halfPer(){ var n=S.settings.rules.periods; return n%2===0?n/2:Math.ceil(n/2); }

/* ---- possession ---- */
function possFlush(g){                  // add the time since the last change to whoever had the ball
  var P=g.st.poss, r=rem(g.clock);
  if(P.team) P['ms'+P.team]+=possSince(g,r);
  P.rem=r; P.per=g.period;
}
function possSince(g,r){                // game-clock time since the last change (across a period break, if any)
  var P=g.st.poss;
  if(P.per===g.period) return Math.max(0,P.rem-r);
  return Math.max(0,P.rem)+Math.max(0,periodLen(S.settings.rules,g.period)-r);   // rest of the old period + time used in this one
}
function possSet(g,team){
  var P=g.st.poss; if(TEAMS.indexOf(team)<0) return;
  possFlush(g);
  if(P.team!==team) P['n'+team]++;       // a new possession only when the ball changes hands
  P.team=team;
  if(S.settings.stats.arrow) g.possession=team;
}
function possMs(g){                     // possession time so far, including the possession happening now
  var P=g.st.poss, out={home:P.mshome,away:P.msaway};
  if(P.team) out[P.team]+=possSince(g,rem(g.clock));
  return out;
}

/* ---- undo: snapshots of what a stat tap can change (this device only) ---- */
var statUndo=[];
function pushUndo(){
  var g=S.game; statUndo.push(clone({st:g.st,score:g.score,fouls:g.fouls,timeouts:g.timeouts,possession:g.possession}));
  if(statUndo.length>80) statUndo.shift();
}

/* ---- talking points ---- */
function talkingPoints(){
  var g=S.game, T=S.settings.teams, d={home:derive(g.st.home),away:derive(g.st.away)}, pm=possMs(g), tot=pm.home+pm.away, out=[];
  var nm=function(t){ return T[t].name||T[t].abbr||(t==='home'?'Home':'Away'); };
  var add=function(score,text){ out.push({s:score,t:text}); };
  var sa=g.score.away, sh=g.score.home;
  if(sa!==sh){ var L=sa>sh?'away':'home', df=Math.abs(sa-sh); add(50+df, nm(L)+' leads by '+df+', '+Math.max(sa,sh)+'–'+Math.min(sa,sh)+'.'); }
  else if(sa+sh>0) add(60,'All square at '+sa+'–'+sh+'.');
  TEAMS.forEach(function(t){
    var x=d[t], y=d[other(t)], n=nm(t), o=nm(other(t));
    if(x.fga>=6&&y.fga>=6&&x.fgp-y.fgp>=10) add(40+(x.fgp-y.fgp), n+' is shooting '+x.fgp+'% from the field ('+x.fgm+'-of-'+x.fga+'), '+o+' '+y.fgp+'%.');
    if(x.tpm>=3) add(25+x.tpm*5, n+' has hit '+x.tpm+' threes ('+x.tpm+'-of-'+x.tpa+').');
    if(x.to>=5&&x.to-y.to>=3) add(30+(x.to-y.to)*4, n+' has '+x.to+' turnovers to '+o+'’s '+y.to+'.');
    if(x.fta>=6) add(20+x.fta, n+' is '+x.ftm+'-of-'+x.fta+' at the free-throw line.');
    if(x.ast>=5&&x.fgm>0) add(20+x.ast*2, n+' has '+x.ast+' assists on '+x.fgm+' made baskets.');
    if(tot>=120000){ var sp=Math.round(pm[t]*100/tot); if(sp>=58) add(25+(sp-50), n+' has had the ball '+sp+'% of the time.'); }
    if(g.fouls[other(t)]>=S.settings.rules.bonusAt) add(18, n+' is in the bonus.');
  });
  out.sort(function(a,b){ return b.s-a.s; });
  return out.map(function(o){ return o.t; });
}

/* ============================================================
   13. COUNTDOWN SCREEN (off air)

/* ---- the clock ---- */
var lastCdText=null;
function fmtCount(ms){                   // 14:59, or 1:05:00 past an hour; whole seconds, never below 0:00
  var s=Math.ceil(Math.max(0,ms)/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=('0'+(s%60)).slice(-2);
  return h?h+':'+('0'+m).slice(-2)+':'+x:m+':'+x;
}
function cdTick(){                       // called from the 60fps loop
  var r=rem(S.game.cd), t=fmtCount(r);
  if(t===lastCdText) return;
  var refit=!lastCdText||lastCdText.length!==t.length;
  lastCdText=t; setDigits(cdEl.time,t); cdEl.time.classList.toggle('zero',r<=0);
  if(refit) cdBarFit();
  if(panelOut.cdTime){ panelOut.cdTime.textContent=t; syncCountdown(); }
}
setInterval(function(){                  // the control side records that the countdown has reached 0:00 and holds it there
  if(!isAuthority) return;
  var C=S.game.cd;
  if(C.running&&rem(C)<=0) commit(function(st,g){ g.cd.running=false; g.cd.ms=0; g.cd.t0=0; });
},100);

function parseLength(txt){               // "15:00", "15" (minutes), "1:05:00", "90s"  ->  milliseconds (or null)
  txt=String(txt||'').trim().toLowerCase(); if(!txt) return null;
  var m;
  if((m=txt.match(/^(\d+):(\d{1,2}):(\d{1,2})$/))) return ((+m[1])*3600+(+m[2])*60+(+m[3]))*1000;
  if((m=txt.match(/^(\d+(?:\.\d+)?)\s*(m|min|mins|minutes)?$/))) return Math.round(parseFloat(m[1])*60000);
  if((m=txt.match(/^(\d+)\s*(s|sec|secs|seconds)$/))) return (+m[1])*1000;
  return parseClock(txt);
}
function parseTarget(txt){               // "4:30 PM", "4:30pm", "16:30", "4:30" -> the next time the clock shows that (real time, ms)
  var m=String(txt||'').trim().toLowerCase().replace(/\./g,'').match(/^(\d{1,2})(?:[:h]?(\d{2}))?\s*(am|pm|a|p)?$/);
  if(!m) return null;
  var h=+m[1], mi=m[2]?+m[2]:0, ap=m[3]?m[3].charAt(0):'', hours;
  if(mi>59||h>23) return null;
  if(ap){ if(h<1||h>12) return null; hours=[(h%12)+(ap==='p'?12:0)]; }
  else if(h===0||h>12) hours=[h];
  else hours=[h%12,(h%12)+12];                 // no AM/PM: whichever comes next
  var d=new Date(), t0=Date.now(), best=null;
  [0,1].forEach(function(day){ hours.forEach(function(hh){
    var t=new Date(d.getFullYear(),d.getMonth(),d.getDate()+day,hh,mi,0,0).getTime();
    if(t>t0&&(best===null||t<best)) best=t; }); });
  if(best===null||best-t0>12*3600000) return -1;   // more than 12 hours away: almost certainly a time that has passed today
  return best;
}
function cdTargetText(C){                // the clock time a countdown is aimed at, in this computer's time
  return new Date(C.target-timeOffset).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
}

/* ---- buttons ---- */
var CDACT={
  cdShow:function(){ commit(function(st,g){ g.cd.show=!g.cd.show; }); },
  cdMode:function(m){ commit(function(st,g){ g.cd.mode=(m==='pre'||m==='half')?m:(g.cd.mode==='half'?'pre':'half'); }); },
  cdStart:function(){
    var C=S.game.cd;
    if(C.running) return;
    if((C.target?C.target-now():rem(C))<=0){ toast('The countdown is at 0:00. Set a new time first.'); return; }
    commit(function(st,g){ var c=g.cd; if(c.target) c.ms=Math.max(0,c.target-now()); run(c); });
  },
  cdPause:function(){ commit(function(st,g){ freeze(g.cd); }); },
  cdReset:function(){ commit(function(st,g){ var c=g.cd;
    if(c.target){ c.ms=Math.max(0,c.target-now()); c.running=false; run(c); }   // back to counting to the clock time
    else { c.ms=c.set; c.running=false; c.t0=0; }                                  // back to the length that was set, waiting for Start
  }); },
  cdSetDur:function(arg){
    var box=$('#cdDur'), v=(typeof arg==='string')?(+arg)*1000:parseLength(box&&box.value);
    if(v==null||!(v>0)){ toast('Type a length like 15:00 or 15'); return; }
    v=Math.min(v,24*3600000);
    commit(function(st,g){ var c=g.cd; c.ms=c.set=v; c.running=false; c.t0=0; c.target=0; });
    if(box&&typeof arg!=='string') box.value='';
    toast('Countdown set to '+fmtCount(v)+'. Press Start when ready.');
  },
  cdSetAt:function(){
    var box=$('#cdAt'), t=parseTarget(box&&box.value);
    if(t===null){ toast('Type a time like 4:30 PM or 16:30'); return; }
    if(t===-1){ toast('That time has already passed today'); return; }
    commit(function(st,g){ var c=g.cd; c.target=t+timeOffset; c.ms=c.set=Math.max(0,t-Date.now()); c.running=false; run(c); });
    box.value='';
    toast('Counting down to '+cdTargetText(S.game.cd));
  }
};

function syncCountdown(){                // called from syncPanel on every change, and by the clock every second
  var o=panelOut; if(!o.cdBtn) return;
  var g=S.game, C=g.cd, T=S.settings.teams, r=rem(C), on=!!C.show;
  o.cdBtn.innerHTML=(on?'■ Hide countdown':'▶ Show countdown')+keyFor('cdShow'); o.cdBtn.classList.toggle('running',on);
  $$('[data-cdmode]',el.panel).forEach(function(n){ n.classList.toggle('on',(C.mode==='half'?'half':'pre')===n.dataset.cdmode); });
  o.cdModeNote.textContent=C.mode==='half'
    ? 'HALFTIME band, the score from the Game tab ('+(T.away.abbr||T.away.name)+' '+g.score.away+' – '+(T.home.abbr||T.home.name)+' '+g.score.home+') and "'+cdLabel('half')+'".'
    : 'Both teams and "Tip-off in". No scores.';
  o.cdLabel.textContent=cdLabel(C.mode);
  if(o.cdTime.textContent!==fmtCount(r)) o.cdTime.textContent=fmtCount(r);
  var state=C.running?'Running':(r<=0?'Finished: holding at 0:00':'Paused');
  if(C.target) state+=' · counting to '+cdTargetText(C);
  if(on&&!cdShown(g)) state+=' · hidden while a full-screen graphic or the names are up';
  o.cdState.textContent=state;
  o.cdStartBtn.classList.toggle('on',!!C.running);
}

/* ============================================================
   10. START
   ============================================================ */
buildPanel();
render(null);
relayInit();
fit();
if(window.ResizeObserver) new ResizeObserver(fit).observe(el.viewport);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ fitNames(); render(S.game); });
requestAnimationFrame(tick);

})();
</script>
